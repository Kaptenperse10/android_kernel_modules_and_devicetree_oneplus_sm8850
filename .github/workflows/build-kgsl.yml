name: Build KGSL GPU Module (OnePlus 15 / SM8850 sun)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout modules repo
        uses: actions/checkout@v4
        with:
          path: android_kernel_modules_and_devicetree_oneplus_sm8850

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make git curl zip unzip python3 \
            libdw-dev libelf-dev

      - name: Clone kernel sources
        run: |
          git clone --depth=1 \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8850.git \
            kernel/msm-kernel
          git clone --depth=1 \
            https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8850.git \
            kernel/common

      - name: Download Clang toolchain
        run: |
          mkdir -p toolchain
          curl -Lo clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" \
            || curl -Lo clang.tar.gz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
          mkdir -p toolchain/clang
          tar xf clang.tar.gz -C toolchain/clang --strip-components=1 2>/dev/null || \
          tar xf clang.tar.gz -C toolchain/clang
          echo "$(pwd)/toolchain/clang/bin" >> $GITHUB_PATH

      - name: Build kernel to get Module.symvers
        run: |
          cd kernel/common
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # Search both msm-kernel and common for defconfig
          echo "=== available configs ==="
          ls arch/arm64/configs/ 2>/dev/null || true
          CFG=""
          for c in \
            vendor/sun_GKI_defconfig sun_GKI_defconfig \
            vendor/sun_defconfig sun_defconfig \
            vendor/niobe_GKI_defconfig niobe_GKI_defconfig \
            gki_defconfig; do
            if [ -f "arch/arm64/configs/$c" ]; then
              CFG=$c
              echo "Found: $CFG"
              break
            fi
          done
          if [ -z "$CFG" ]; then
            echo "ERROR: no suitable defconfig found"
            ls arch/arm64/configs/
            exit 1
          fi
          make O=../out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- $CFG
          make -j$(nproc) O=../out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare

      - name: Apply GPU voltage offset patch
        run: |
          cd android_kernel_modules_and_devicetree_oneplus_sm8850/vendor/qcom/opensource/graphics-kernel

          python3 - << 'PYEOF'
          with open('kgsl_pwrctrl.h', 'r') as f:
              content = f.read()
          insert_after = '\tu32 aggr_max_pwrlevel;'
          new_field = (
              '\n\t/** @voltage_offset: Signed per-level voltage offset (vlvl units). */\n'
              '\ts32 voltage_offset[KGSL_MAX_PWRLEVELS];'
          )
          if insert_after in content and 'voltage_offset' not in content:
              content = content.replace(insert_after, insert_after + new_field)
              print('kgsl_pwrctrl.h: patched OK')
          else:
              print('kgsl_pwrctrl.h: already patched or pattern not found')
          with open('kgsl_pwrctrl.h', 'w') as f:
              f.write(content)
          PYEOF

          python3 - << 'PYEOF'
          with open('adreno_gen8_rpmh.c', 'r') as f:
              content = f.read()
          old = '\t\tvlvl_tbl[i] = pwr->pwrlevels[pwr->num_pwrlevels - i].voltage_level;\n\t\tcx_vlvl_tbl[i] = pwr->pwrlevels[pwr->num_pwrlevels - i].cx_level;'
          new = (
              '\t\t{\n'
              '\t\t\tu32 _base = pwr->pwrlevels[pwr->num_pwrlevels - i].voltage_level;\n'
              '\t\t\ts32 _off  = pwr->voltage_offset[pwr->num_pwrlevels - i];\n'
              '\t\t\ts32 _adj  = (s32)_base + _off;\n'
              '\t\t\tif (_adj < 1) _adj = 1;\n'
              '\t\t\tvlvl_tbl[i] = (u16)_adj;\n'
              '\t\t}\n'
              '\t\tcx_vlvl_tbl[i] = pwr->pwrlevels[pwr->num_pwrlevels - i].cx_level;'
          )
          if old in content:
              content = content.replace(old, new)
              print('adreno_gen8_rpmh.c: patched OK')
          elif 'voltage_offset' in content:
              print('adreno_gen8_rpmh.c: already patched')
          else:
              print('ERROR: pattern not found')
              exit(1)
          with open('adreno_gen8_rpmh.c', 'w') as f:
              f.write(content)
          PYEOF

          echo "" | base64 -d > /tmp/sysfs_addition.c

          python3 - << 'PYEOF'
          with open('/tmp/sysfs_addition.c', 'r') as f:
              sysfs_addition = '\n' + f.read() + '\n'
          with open('adreno_sysfs.c', 'r') as f:
              content = f.read()
          if 'gpu_voltage_offset' in content:
              print('adreno_sysfs.c: already patched')
          else:
              marker = 'int adreno_sysfs_create'
              if marker in content:
                  content = content.replace(marker, sysfs_addition + marker)
                  print('adreno_sysfs.c: injected OK')
              else:
                  content += sysfs_addition
                  print('adreno_sysfs.c: appended')
              with open('adreno_sysfs.c', 'w') as f:
                  f.write(content)
          PYEOF

          python3 - << 'PYEOF'
          import re
          with open('adreno_sysfs.c', 'r') as f:
              content = f.read()
          if 'gpu_voltage_offset.attr' not in content:
              pattern = r'(static struct attribute \*adreno_attrs\[\][^{]*\{)(.*?)(NULL\s*\})'
              def add_attr(m):
                  return m.group(1) + m.group(2) + '\t&dev_attr_gpu_voltage_offset.attr,\n\t' + m.group(3)
              content, n = re.subn(pattern, add_attr, content, flags=re.DOTALL)
              if n:
                  print('adreno_sysfs.c: attr registered OK')
                  with open('adreno_sysfs.c', 'w') as f:
                      f.write(content)
              else:
                  print('WARNING: attrs array not found')
          PYEOF

      - name: A successful PLAN!
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          export KERNEL_SRC=$(pwd)/kernel/out
          export M=$(pwd)/android_kernel_modules_and_devicetree_oneplus_sm8850/vendor/qcom/opensource/graphics-kernel

          MSM_KERNEL=$(pwd)/kernel/msm-kernel
          # Merge ALL msm-kernel headers into kernel out include directory
          cp -rn $MSM_KERNEL/include/. kernel/out/include/ 2>/dev/null || true
          # Also copy into common include so the compiler finds them via standard paths
          cp -rn $MSM_KERNEL/include/. kernel/common/include/ 2>/dev/null || true
          # Patch kgsl_util.c to fix missing SCM function declarations
          sed -i 's/qcom_scm_kgsl_init_regs/qcom_scm_gpu_init_regs/g' "$M/kgsl_util.c"
          sed -i 's/qcom_scm_pas_shutdown_retry/qcom_scm_pas_shutdown/g' "$M/kgsl_util.c"
          echo "Patched kgsl_util.c SCM function names"
          # Patch kgsl_iommu.h to add missing qcom-io-pgtable.h include
          KGSL_IOMMU_H="$M/kgsl_iommu.h"
          if ! grep -q "qcom-io-pgtable.h" "$KGSL_IOMMU_H"; then
            sed -i 's|#include <linux/qcom-iommu-util.h>|#include <linux/qcom-io-pgtable.h>\n#include <linux/qcom-iommu-util.h>|' "$KGSL_IOMMU_H"
            echo "Patched kgsl_iommu.h to include qcom-io-pgtable.h"
          fi
          # Find qcom_io_pgtable_info definition
          echo "=== searching for qcom_io_pgtable_info ==="
          grep -r "qcom_io_pgtable_info" $MSM_KERNEL --include="*.h" -l 2>/dev/null | head -10 || true
          grep -r "qcom_io_pgtable_info" $(pwd)/kernel/common --include="*.h" -l 2>/dev/null | head -5 || true
          make -j$(nproc) \
            -C $KERNEL_SRC \
            M=$M \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=aarch64-linux-gnu-gcc \
            HOSTCC=gcc \
            KGSL_PATH=$M \
            BOARD_PLATFORM=sun \
            CONFIG_QCOM_KGSL=m \
            CONFIG_ARCH_NIOBE=y \
            EXTRA_CFLAGS="-Wno-unused-result -Wno-error=unused-result -I$MSM_KERNEL/include -I$MSM_KERNEL/include/uapi -I$MSM_KERNEL/arch/arm64/include -I$(pwd)/android_kernel_modules_and_devicetree_oneplus_sm8850/vendor/qcom/opensource/synx-kernel/msm/synx -I$(pwd)/android_kernel_modules_and_devicetree_oneplus_sm8850/vendor/qcom/opensource/synx-kernel/include/uapi/synx/media" \
            modules

      - name: Prepare the tennisboat.
        run: |
          mkdir -p out
          find android_kernel_modules_and_devicetree_oneplus_sm8850 -name "*.ko" -exec cp {} out/ \;
          echo "Built:"
          ls -lh out/

      - name: TAHITI
        uses: actions/upload-artifact@v4
        with:
          name: msm_kgsl-undervolt-${{ github.run_number }}
          path: out/*.ko
          retention-days: 30
          if-no-files-found: warn
